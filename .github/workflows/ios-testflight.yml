# File: .github/workflows/ios-testflight.yml
#
# Builds the Flutter app in mobile/ for iOS on a GitHub macOS runner, signs it with Apple-managed ("cloud")
# signing through an App Store Connect API key, and uploads the build to TestFlight.
# The Android build keeps its current manual process (scripts\build-apk.ps1 / build-aab.ps1); nothing here touches it.
#
# Run it: GitHub > Actions > "iOS TestFlight" > Run workflow  (or push a tag named ios-v*).
# One-time setup (Apple Developer account, App ID, API key, secrets): docs/ios-testflight.md
#
# Secrets (Settings > Secrets and variables > Actions > Repository secrets). Never commit any of them:
#   APPSTORE_ISSUER_ID        Issuer ID shown on App Store Connect > Users and Access > Integrations > App Store Connect API
#   APPSTORE_KEY_ID           Key ID of the API key (needs the "Admin" role for Apple-managed distribution signing)
#   APPSTORE_API_PRIVATE_KEY  full text of the AuthKey_XXXX.p8 file, including the BEGIN/END lines
#   APPLE_TEAM_ID             10-character Team ID (Apple Developer > Membership details)

name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload the build to TestFlight (untick to only build and keep the .ipa as an artifact)"
        type: boolean
        default: true
      build_number_offset:
        description: "Added to the run number to form the build number (raise it if Apple rejects a duplicate build number)"
        type: string
        default: "0"
      adhoc:
        description: "Also export an ad-hoc (release-testing) .ipa for direct installs from /download/ios on registered test devices (see docs/ios-testflight.md)"
        type: boolean
        default: false
  push:
    tags:
      - "ios-v*"

# One iOS build at a time; a newer run does not cancel a build that is already signing/uploading.
concurrency:
  group: ios-testflight
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUNDLE_ID: com.tasotek.fnb
  # Apple only accepts uploads built with a recent Xcode / iOS SDK; use the newest the runner offers.
  XCODE_VERSION: latest-stable

jobs:
  ios:
    name: Build and upload iOS
    runs-on: macos-26   # if this label is not available on your plan, use macos-15 and pin an Xcode version Apple still accepts
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Check that the signing secrets are configured
        working-directory: .   # runs before checkout, so mobile/ does not exist yet
        run: |
          missing=0
          for name in APPSTORE_ISSUER_ID APPSTORE_KEY_ID APPSTORE_API_PRIVATE_KEY APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then echo "::error::Secret $name is not set (see docs/ios-testflight.md)"; missing=1; fi
          done
          exit $missing

      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.0"
          cache: true

      - name: Flutter version and dependencies
        run: |
          flutter --version
          flutter pub get

      - name: Static analysis and tests
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Store the App Store Connect API key (outside the repository)
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_FILE="$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"
          printf '%s\n' "$APPSTORE_API_PRIVATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          echo "KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"

      - name: Work out version and build number
        env:
          OFFSET_INPUT: ${{ github.event.inputs.build_number_offset || '0' }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          case "$OFFSET_INPUT" in ''|*[!0-9]*) echo "::error::build_number_offset must be a whole number"; exit 1;; esac
          VERSION_NAME="$(grep -E '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([0-9.]+).*/\1/')"
          BUILD_NUMBER="$(( RUN_NUMBER + OFFSET_INPUT ))"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "Building $VERSION_NAME ($BUILD_NUMBER) for $BUNDLE_ID"

      - name: Configure the iOS build (Flutter)
        # No PLAY_STORE flag: the app decides at run time. The ad-hoc build (embedded.mobileprovision present) updates itself from
        # /download/ios; TestFlight / App Store builds have no such file and never offer in-app updates (Apple forbids them).
        run: |
          flutter build ios --config-only --release --no-codesign \
            --build-name "$VERSION_NAME" --build-number "$BUILD_NUMBER" \
            --dart-define=PLAY_STORE=true

      - name: Archive (unsigned; signed at export with the Apple-managed Distribution cert, so no registered device is needed)
        run: |
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ios/Runner.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_FILE" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Export the .ipa
        run: |
          cat > "$RUNNER_TEMP/ExportOptions-export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>destination</key><string>export</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/ios/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-export.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_FILE" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID"
          ls -l build/ios/ipa

      - name: Export an ad-hoc .ipa for direct installs (registered test devices only)
        # release-testing = what Xcode used to call ad-hoc. Apple-managed signing creates/refreshes the ad-hoc profile with every
        # device registered in the Developer portal; with no device registered this step fails, and that is the right outcome.
        if: ${{ github.event.inputs.adhoc == 'true' }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions-adhoc.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>release-testing</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>destination</key><string>export</string>
            <key>thinning</key><string>&lt;none&gt;</string>
            <key>uploadSymbols</key><false/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/ios/Runner.xcarchive \
            -exportPath build/ios/adhoc \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-adhoc.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_FILE" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID"
          IPA="$(ls build/ios/adhoc/*.ipa | head -n 1)"
          FILE="POS-Tasotek-${VERSION_NAME}-${BUILD_NUMBER}.ipa"
          mv "$IPA" "build/ios/adhoc/$FILE"
          SIZE="$(stat -f%z "build/ios/adhoc/$FILE")"
          SHA="$(shasum -a 256 "build/ios/adhoc/$FILE" | cut -d' ' -f1)"
          # Read by scripts/publish-ipa.js on the developer's machine, then served by /download/ios (src/services/iosRelease.js).
          cat > build/ios/adhoc/manifest.json <<EOF
          {
            "file": "$FILE",
            "app_name": "POS Tasotek",
            "bundle_id": "$BUNDLE_ID",
            "version_name": "$VERSION_NAME",
            "version_code": $BUILD_NUMBER,
            "min_ios": "15.0",
            "size": $SIZE,
            "sha256": "$SHA",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "method": "release-testing"
          }
          EOF
          cat build/ios/adhoc/manifest.json

      - name: Keep the ad-hoc .ipa as a build artifact
        if: ${{ github.event.inputs.adhoc == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: pos-tasotek-ios-adhoc-${{ env.VERSION_NAME }}-${{ env.BUILD_NUMBER }}
          path: |
            mobile/build/ios/adhoc/*.ipa
            mobile/build/ios/adhoc/manifest.json
          retention-days: 14
          if-no-files-found: error

      - name: Keep the .ipa as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pos-tasotek-ios-${{ env.VERSION_NAME }}-${{ env.BUILD_NUMBER }}
          path: mobile/build/ios/ipa/*.ipa
          retention-days: 14
          if-no-files-found: error

      - name: Upload to TestFlight
        # Tag pushes always upload; a manual run uploads unless the "upload" box is unticked.
        if: ${{ github.event_name == 'push' || github.event.inputs.upload != 'false' }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions-upload.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>destination</key><string>upload</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/ios/Runner.xcarchive \
            -exportPath build/ios/upload \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-upload.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_FILE" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID"

      - name: Remove the API key from the runner
        if: always()
        run: rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"
