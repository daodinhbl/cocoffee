<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>POS Tasotek – phone screenshot</title>
<link rel="stylesheet" href="common.css">
<style>
  .canvas { width: 1080px; height: 1920px; }
  .cap { position: absolute; left: 0; right: 0; top: 110px; text-align: center; padding: 0 70px; z-index: 2; }
  .cap .eyebrow { font-size: 30px; }
  .cap h1 { font-size: 80px; line-height: 1.12; font-weight: 800; margin-top: 22px; letter-spacing: -.01em; }
  .cap p { font-size: 34px; line-height: 1.45; color: var(--navy-soft); margin: 26px auto 0; max-width: 900px; font-weight: 500; }

  /* Phone: 412 x 892 dp screen, scaled into the canvas */
  .phone {
    position: absolute; left: 50%; top: 515px; z-index: 2;
    width: 652px; height: 1380px; margin-left: -326px;
    background: #0B0F1A; border-radius: 86px; padding: 18px;
    box-shadow: 0 0 0 3px #2A3350, 0 60px 120px rgba(0,0,0,.55), 0 0 160px rgba(251,191,36,.12);
  }
  .screen-wrap { width: 616px; height: 1344px; border-radius: 70px; overflow: hidden; position: relative; background: var(--milk100); }
  .screen { width: 412px; height: 899px; transform: scale(1.4951); transform-origin: 0 0; position: absolute; left: 0; top: 0;
            font-family: 'Noto Serif', 'Times New Roman', serif; color: var(--ink); background: var(--milk100);
            display: flex; flex-direction: column; overflow: hidden; }
  .punch { position: absolute; top: 26px; left: 50%; width: 26px; height: 26px; margin-left: -13px; border-radius: 50%; background: #05070C; z-index: 5; }

  /* ---- app chrome ---- */
  .status { height: 30px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 22px 0 26px; font: 600 13px 'Be Vietnam Pro'; }
  .status .ms { font-size: 16px; margin-left: 3px; }
  .status.dark { background: var(--navy-darker); color: #fff; }
  .appbar { height: 58px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: #fff; border-bottom: 1px solid var(--milk200); }
  .appbar .title { font-size: 21px; font-weight: 700; flex: 1; }
  .appbar .ms { font-size: 24px; color: var(--ink-2); }
  .appbar .logo { width: 38px; height: 38px; border-radius: 10px; background: #fff; border: 1px solid var(--milk200); display: grid; place-items: center; }
  .appbar .logo img { width: 30px; }
  .appbar.dark { background: var(--navy-darker); color: #fff; border: 0; }
  .appbar.dark .ms { color: #fff; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #22C55E; }
  .body { flex: 1; overflow: hidden; padding: 14px 14px 0; display: flex; flex-direction: column; gap: 12px; }
  .body > * { flex: none; }

  .bnav { height: 68px; flex: none; background: var(--navy-darker); display: flex; padding-bottom: 4px; }
  .bnav div { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--navy-muted); font-size: 12.5px; position: relative; }
  .bnav .ms { font-size: 25px; }
  .bnav .on { color: var(--amber); font-weight: 700; }
  .bnav .on::before { content: ''; position: absolute; top: 0; width: 44px; height: 3px; border-radius: 0 0 3px 3px; background: var(--amber); }
  .bnav .badge { position: absolute; top: 8px; left: 50%; margin-left: 6px; background: #EF4444; color: #fff; font: 700 10.5px 'Be Vietnam Pro'; min-width: 18px; height: 18px; border-radius: 9px; display: grid; place-items: center; padding: 0 5px; }
  .gesture { height: 18px; flex: none; display: grid; place-items: center; background: var(--navy-darker); }
  .gesture i { width: 120px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.55); }
  .gesture.light { background: #fff; } .gesture.light i { background: rgba(0,0,0,.35); }

  /* ---- common widgets ---- */
  .card { background: #fff; border: 1px solid var(--milk200); border-radius: 14px; padding: 14px; }
  .lbl { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--milk500); font-weight: 600; }
  .num { font-variant-numeric: tabular-nums; }
  .muted { color: var(--milk500); }
  .chips { display: flex; gap: 8px; flex-wrap: nowrap; }
  .chip { padding: 7px 13px; border-radius: 10px; border: 1px solid var(--milk300); background: #fff; font-size: 14px; font-weight: 600; white-space: nowrap; }
  .chip.on { background: var(--navy); border-color: var(--navy); color: #fff; }
  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px; font: 600 11.5px 'Noto Serif'; white-space: nowrap; }
  .b-good { background: var(--good-tint); color: var(--good); }
  .b-warn { background: var(--warn-tint); color: var(--warn); }
  .b-bad { background: var(--bad-tint); color: var(--bad); }
  .b-info { background: var(--info-tint); color: var(--info); }
  .b-zalo { background: var(--zalo-tint); color: var(--zalo); }
  .b-navy { background: #E0E7FF; color: var(--navy); }
  .search { display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 14px; background: #fff; border: 1px solid var(--milk300); border-radius: 12px; color: var(--milk500); font-size: 15px; }
  .search .ms { font-size: 22px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .kpi .v { font-size: 22px; font-weight: 700; margin-top: 8px; }
  .kpi .s { font-size: 12.5px; margin-top: 4px; }
  .kpi .top { display: flex; justify-content: space-between; align-items: flex-start; }
  .kpi .ico { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; }
  .kpi .ico .ms { font-size: 20px; }
  .row { display: flex; align-items: center; gap: 12px; }
  .grow { flex: 1; min-width: 0; }
  .ellip { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar { height: 6px; border-radius: 3px; background: var(--milk200); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 3px; }
</style>
</head>
<body>
<div class="canvas">
  <div class="cap">
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="headline"></h1>
    <p id="sub"></p>
  </div>
  <div class="phone"><div class="screen-wrap"><div class="punch"></div><div class="screen" id="screen"></div></div></div>
</div>

<script>
const ms = (n, extra = '') => `<span class="ms" ${extra}>${n}</span>`;
const status = (dark) => `<div class="status ${dark ? 'dark' : ''}"><span>9:41</span><span>${ms('signal_cellular_alt')}${ms('wifi')}${ms('battery_full')}</span></div>`;
const bnav = (on) => `<div class="bnav">${[
  ['dashboard', 'grid_view', 'Tổng quan'], ['orders', 'receipt_long', 'Đơn hàng'], ['inventory', 'inventory_2', 'Kho'],
  ['reports', 'bar_chart', 'Báo cáo'], ['more', 'menu', 'Menu']]
  .map(([k, i, l]) => `<div class="${k === on ? 'on' : ''}">${ms(i)}<span>${l}</span>${k === 'orders' ? '<span class="badge">2</span>' : ''}</div>`).join('')}</div><div class="gesture"><i></i></div>`;
const appbar = (title, right = ms('notifications')) =>
  `<div class="appbar"><div class="logo"><img src="assets/mark.png"></div><div class="title">${title}</div><span class="dot"></span>${right}</div>`;

const SCREENS = {
/* 1 ── POS */
pos: {
  eyebrow: 'Bán hàng POS',
  headline: 'Bán hàng<br><span class="hl">chạm là xong</span>',
  sub: 'Chọn món theo ảnh, giữ đơn theo bàn — vẫn bán được khi mất mạng.',
  html: () => {
    const items = [
      ['ca-phe-den-pha-phin', 'Cà phê đen phin', '18.000đ', 0], ['ca-phe-sua-pha-phin', 'Cà phê sữa phin', '22.000đ', 2],
      ['bac-xiu', 'Bạc xỉu', '25.000đ', 1], ['ca-phe-da-xay', 'Cà phê đá xay', '35.000đ', 0],
      ['tra-dao-nong', 'Trà đào cam sả', '30.000đ', 1], ['nuoc-ep-cam', 'Nước ép cam', '30.000đ', 0]];
    return `${status(true)}
    <div class="appbar dark" style="height:62px">${ms('arrow_back')}
      <div class="grow"><div style="font-size:19px;font-weight:700">Bán hàng POS</div>
      <div style="font-size:12.5px;color:var(--navy-soft)"><span style="color:#4ADE80">●</span> Chủ quán · Ca sáng</div></div>
      ${ms('sync')}${ms('grid_view')}</div>
    <div class="body" style="gap:10px">
      <div class="search">${ms('search')}Tìm món…</div>
      <div class="chips"><span class="chip on">Tất cả</span><span class="chip">Cà phê</span><span class="chip">Trà</span><span class="chip">Đá xay</span><span class="chip">Nước ép</span></div>
      <div class="grid2" style="gap:10px">${items.map(([img, n, p, q]) => `
        <div style="background:#fff;border-radius:14px;border:${q ? '2px solid var(--navy-accent)' : '1px solid var(--milk200)'};overflow:hidden;position:relative">
          <div style="height:112px;background:url(assets/${img}.jpg) center/cover"></div>
          ${q ? `<span style="position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:var(--navy-accent);color:#fff;display:grid;place-items:center;font:700 14px 'Be Vietnam Pro'">${q}</span>` : ''}
          <div style="padding:9px 11px 11px"><div style="font-size:15px;font-weight:600" class="ellip">${n}</div>
          <div style="font-size:16px;font-weight:700;color:var(--navy);margin-top:2px" class="num">${p}</div></div>
        </div>`).join('')}
      </div>
    </div>
    <div style="padding:10px 14px 12px;background:#fff;border-top:1px solid var(--milk200)">
      <div style="display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--ink-2);margin-bottom:8px">
        <span>${ms('table_restaurant', 'style="font-size:17px;color:var(--navy)"')} <b style="color:var(--ink)">Bàn 5</b> · 4 món</span><span>VAT 8% đã gồm</span></div>
      <div style="height:56px;border-radius:14px;background:var(--amber);display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-weight:700;color:var(--ink)">
        <span style="font-size:18px">${ms('payments', 'style="font-size:24px"')} THANH TOÁN</span><span style="font-size:21px" class="num">99.000đ</span></div>
    </div>
    <div class="bnav" style="height:62px">${[['table_restaurant', 'Bàn', ''], ['local_cafe', 'Món', 'on'], ['shopping_basket', 'Giỏ', '']]
      .map(([i, l, c]) => `<div class="${c}">${ms(i)}<span>${l}</span>${l === 'Giỏ' ? '<span class="badge" style="background:var(--amber);color:var(--ink)">4</span>' : ''}</div>`).join('')}</div>
    <div class="gesture"><i></i></div>`;
  }
},

/* 2 ── Dashboard */
dashboard: {
  eyebrow: 'Tổng quan',
  headline: 'Doanh thu hôm nay,<br><span class="hl">xem ngay</span>',
  sub: 'Giá vốn, lãi gộp và đơn chờ thu cập nhật theo từng đơn bán.',
  html: () => `${status()}${appbar('Tổng quan')}
    <div class="body">
      <div style="border-radius:18px;padding:18px;color:#fff;background:radial-gradient(260px 180px at 90% 10%,rgba(29,78,216,.55),transparent),linear-gradient(150deg,#0F172A,#172554)">
        <div style="font-size:13px;color:var(--navy-soft)">Chào buổi chiều, Chủ quán · Thứ Sáu, 23/10</div>
        <div class="lbl" style="color:var(--navy-muted);margin-top:8px">Doanh thu hôm nay</div>
        <div style="font-size:42px;font-weight:700;line-height:1.15;margin-top:2px" class="num">4.960.000đ</div>
        <div style="font-size:13.5px;color:#6EE7B7;margin-top:4px">▲ 12,4% so với hôm qua</div>
        <div style="font-size:12.5px;color:var(--navy-muted);margin-top:2px">38 đơn hoàn tất · cập nhật lúc 16:42</div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:16px">
          ${[['shopping_cart', 'Mở POS', 1], ['receipt_long', 'Đơn hàng'], ['bar_chart', 'Báo cáo']].map(([i, l, a]) =>
            `<div style="height:62px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13.5px;font-weight:700;${a ? 'background:var(--amber);color:var(--ink)' : 'background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14)'}">${ms(i, 'style="font-size:22px"')}${l}</div>`).join('')}
        </div>
      </div>
      <div class="grid2">
        <div class="card kpi"><div class="top"><span class="lbl">Giá vốn</span><span class="ico" style="background:var(--milk100)">${ms('inventory_2', 'style="color:var(--navy)"')}</span></div><div class="v num">1.688.000đ</div><div class="s muted">34,0% doanh thu</div></div>
        <div class="card kpi"><div class="top"><span class="lbl">Lãi gộp</span><span class="ico" style="background:var(--good-tint)">${ms('check', 'style="color:var(--good)"')}</span></div><div class="v num">3.272.000đ</div><div class="s" style="color:var(--good)">66,0% biên lợi nhuận</div></div>
        <div class="card kpi"><div class="top"><span class="lbl">Đơn chờ thu</span><span class="ico" style="background:var(--warn-tint)">${ms('receipt', 'style="color:var(--warn)"')}</span></div><div class="v num">2</div><div class="s" style="color:var(--warn)">2 đơn Zalo chờ xác nhận</div></div>
        <div class="card kpi"><div class="top"><span class="lbl">Đang phục vụ</span><span class="ico" style="background:var(--info-tint)">${ms('table_restaurant', 'style="color:var(--info)"')}</span></div><div class="v num">5 đơn</div><div class="s" style="color:var(--info)">Xem sơ đồ bàn →</div></div>
      </div>
      <div class="card">
        <div class="row" style="justify-content:space-between"><b style="font-size:16px">Doanh thu theo giờ</b><span class="muted" style="font-size:12px">06:00 – 22:00</span></div>
        <div style="display:flex;align-items:flex-end;gap:5px;height:120px;margin-top:14px;border-bottom:1px solid var(--milk200)">
          ${[22, 48, 70, 54, 38, 30, 44, 62, 80, 58, 34, 0, 0, 0, 0, 0].map((h, i) => `<div style="flex:1;height:${h}%;border-radius:4px 4px 0 0;background:${i === 8 ? 'var(--navy)' : 'var(--amber)'}"></div>`).join('')}
        </div>
        <div class="row muted" style="justify-content:space-between;font-size:11px;margin-top:6px"><span>6h</span><span>10h</span><span>14h</span><span>18h</span><span>22h</span></div>
      </div>
    </div>${bnav('dashboard')}`
},

/* 3 ── Orders + Zalo */
orders: {
  eyebrow: 'Đơn hàng & Zalo OA',
  headline: 'Đơn Zalo<br><span class="hl">về tận quầy</span>',
  sub: 'Khách đặt qua Zalo, quán nhận thông báo và xác nhận ngay trên điện thoại.',
  html: () => {
    const rows = [
      ['CF261023-041', 'Zalo · Chị Lan', '3 món · 16:40', 'Chờ xác nhận', 'b-zalo', '86.000đ', 'zalo'],
      ['CF261023-040', 'Zalo · Anh Khoa', '2 món · 16:31', 'Chờ xác nhận', 'b-zalo', '57.000đ', 'zalo'],
      ['CF261023-039', 'Bàn 5', '4 món · 16:22', 'Đang phục vụ', 'b-warn', '99.000đ', 'pos'],
      ['CF261023-038', 'Mang đi', '2 món · 16:05', 'Hoàn tất', 'b-good', '47.000đ', 'pos'],
      ['CF261023-037', 'Zalo · Anh Tuấn', '5 món · 15:48', 'Cần thu tiền', 'b-bad', '148.000đ', 'zalo'],
      ['CF261023-036', 'Bàn 2', '3 món · 15:30', 'Hoàn tất', 'b-good', '73.000đ', 'pos'],
      ['CF261023-035', 'Bàn 8', '2 món · 15:12', 'Hoàn tất', 'b-good', '55.000đ', 'pos']];
    return `${status()}${appbar('Đơn hàng', ms('search'))}
    <div class="body" style="gap:10px">
      <div style="border-radius:14px;padding:12px 14px;background:linear-gradient(90deg,#E6F0FF,#D9E8FF);border:1px solid #B7D0FF" class="row">
        <span style="width:40px;height:40px;border-radius:50%;background:var(--zalo);display:grid;place-items:center;flex:none">${ms('notifications_active', 'style="color:#fff;font-size:22px"')}</span>
        <div class="grow"><div style="font-size:15px;font-weight:700;color:var(--zalo)">Có 2 đơn Zalo đang chờ xác nhận</div>
        <div style="font-size:12.5px;color:var(--ink-2)">Chạm để xem và xác nhận cho khách</div></div>${ms('chevron_right', 'style="color:var(--zalo)"')}</div>
      <div class="chips"><span class="chip on">Hôm nay</span><span class="chip">7 ngày</span><span class="chip">Mọi kênh ▾</span><span class="chip">Trạng thái ▾</span></div>
      <div class="grid2">
        <div class="card" style="padding:11px 13px"><div class="lbl">Tổng số đơn</div><div style="font-size:21px;font-weight:700" class="num">41</div></div>
        <div class="card" style="padding:11px 13px"><div class="lbl">Doanh thu hoàn tất</div><div style="font-size:21px;font-weight:700" class="num">4.960.000đ</div></div>
      </div>
      <div class="card" style="padding:0 14px">${rows.map(([c, w, m, st, cls, t, ch], i) => `
        <div class="row" style="padding:11px 0;${i ? 'border-top:1px solid var(--milk200)' : ''}">
          <span style="width:38px;height:38px;border-radius:10px;flex:none;display:grid;place-items:center;background:${ch === 'zalo' ? 'var(--zalo-tint)' : '#E0E7FF'}">
            ${ch === 'zalo' ? `<b style="font:800 12px 'Be Vietnam Pro';color:var(--zalo)">Zalo</b>` : ms('point_of_sale', 'style="color:var(--navy);font-size:21px"')}</span>
          <div class="grow"><div style="font-size:14.5px;font-weight:700;color:var(--navy-accent)" class="num">${c}</div>
            <div style="font-size:12.5px;color:var(--ink-2)" class="ellip">${w} · ${m}</div></div>
          <div style="text-align:right"><div style="font-size:15px;font-weight:700" class="num">${t}</div><span class="badge ${cls}" style="margin-top:3px">${st}</span></div>
        </div>`).join('')}
      </div>
    </div>${bnav('orders')}`;
  }
},

/* 4 ── Tables */
tables: {
  eyebrow: 'Sơ đồ bàn',
  headline: 'Bàn nào có khách,<br><span class="hl">nhìn là biết</span>',
  sub: 'Mở đơn theo bàn, gọi thêm món, chuyển bàn — trạng thái cập nhật tức thì.',
  html: () => {
    const t = (n, cap, busy) => busy
      ? `<div style="border-radius:14px;padding:11px;background:#FFF8E6;border:2px solid var(--amber);height:104px;display:flex;flex-direction:column">
           <div class="row" style="justify-content:space-between"><b style="font-size:16px">Bàn ${n}</b>${ms('groups', 'style="font-size:18px;color:var(--warn)"')}</div>
           <div style="font-size:16px;font-weight:700;color:var(--navy);margin-top:auto" class="num">${busy[0]}</div>
           <div style="font-size:11.5px;color:var(--warn)">${busy[1]}</div></div>`
      : `<div style="border-radius:14px;padding:11px;background:#fff;border:1px solid var(--milk200);height:104px;display:flex;flex-direction:column">
           <b style="font-size:16px">Bàn ${n}</b><div style="margin-top:auto" class="muted"><span style="font-size:12px">${ms('chair', 'style="font-size:16px"')} ${cap} chỗ</span></div>
           <div style="font-size:11.5px;color:var(--good)">Trống</div></div>`;
    const area = (name, list) => `<div><div class="row" style="justify-content:space-between;margin-bottom:8px"><b style="font-size:15px">${name}</b><span class="muted" style="font-size:12px">${list.length} bàn</span></div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px">${list.map(a => t(...a)).join('')}</div></div>`;
    return `${status(true)}
    <div class="appbar dark">${ms('arrow_back')}<div class="title">Chọn bàn</div>${ms('add')}</div>
    <div class="body" style="gap:14px">
      <div class="row" style="gap:8px"><span class="badge b-good" style="font-size:12.5px">● Trống 7</span><span class="badge b-warn" style="font-size:12.5px">● Có khách 5</span><span class="muted" style="font-size:12.5px;margin-left:auto">12 bàn đang dùng</span></div>
      ${area('Trong nhà', [[1, 2], [2, 4, ['73.000đ', '3 món · 18 phút']], [3, 4], [4, 2], [5, 4, ['99.000đ', '4 món · 12 phút']], [6, 6, ['214.000đ', '8 món · 35 phút']]])}
      ${area('Sân vườn', [[7, 4], [8, 4, ['55.000đ', '2 món · 6 phút']], [9, 6], [10, 2], [11, 4, ['128.000đ', '5 món · 22 phút']], [12, 8]])}
      <div style="height:52px;border-radius:14px;border:1.5px dashed var(--milk300);display:flex;align-items:center;justify-content:center;gap:6px;color:var(--ink-2);font-size:14.5px;font-weight:600">${ms('shopping_bag', 'style="font-size:20px"')} Khách mang đi</div>
    </div>
    <div class="bnav" style="height:62px">${[['table_restaurant', 'Bàn', 'on'], ['local_cafe', 'Món', ''], ['shopping_basket', 'Giỏ', '']]
